site_name: AcqStore
site_description: Acquisition-backed file loading, metadata, ROIs, and scientific analysis for microscopy data.
repo_url: https://github.com/mapmanager/acqstore
repo_name: mapmanager/acqstore

theme:
  name: material
  custom_dir: docs/assets/overrides
  features:
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

hooks:
  - docs/hooks.py

plugins:
  - search
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]
  - mkdocs-jupyter:
      include_source: true
      execute: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: !relative $docs_dir
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true

exclude_docs: |
  hooks.py
  schemas/*.md

nav:
  - Home: index.md
  - Install: install.md
  - Sample data: sample-data.md
  - Loading an image: loading.md
  - AcqImage: acqimage.md
  - OME-Zarr export format: ome-zarr-export-format.md
  - ROIs: rois.md
  - Analysis:
      - analysis/index.md
      - Kymograph Analysis:
          - Velocity: analysis/kymograph/velocity-analysis.md
          - Diameter: analysis/kymograph/diameter-analysis.md
          - Sum Intensity: analysis/kymograph/sum-intensity-analysis.md
          - Heart Rate: analysis/kymograph/heart-rate-analysis.md
  - Notebooks:
      - notebooks.md
      - Load and Plot Image: notebooks/load-and-plot-image.ipynb
      - Velocity Analysis Notebook: notebooks/velocity-analysis.ipynb
      - Diameter Analysis Notebook: notebooks/diameter-analysis.ipynb
      - Sum Intensity Analysis Notebook: notebooks/sum-intensity-analysis.ipynb
      - Kymograph Reference Images: notebooks/kymograph-reference-image.ipynb
      - Heart Rate Analysis Notebook: notebooks/heart-rate-analysis.ipynb
      - Heart Rate Batch Analysis Notebook: notebooks/heart-rate-batch-analysis.ipynb
      - Generating a Randomized File Subset: notebooks/generating-randomized-file-for-analysis.ipynb
  - Reproducibility: reproducibility.md
  - Contributing: contributing.md
  - API:
      - api/index.md
      - AcqImage: api/acq-image.md
      - AcqImageList: api/acq-image-list.md
      - Analysis Core: api/analysis-core.md
      - Velocity Analysis: api/velocity-analysis.md
      - Diameter Analysis: api/diameter-analysis.md
      - Sum Intensity Analysis: api/sum-intensity-analysis.md
      - Heart Rate Analysis: api/heart-rate-analysis.md
      - Event Analysis: api/event-analysis.md
      - Analysis Pools: api/analysis-pools.md
      - Batch Analysis: api/batch-analysis.md

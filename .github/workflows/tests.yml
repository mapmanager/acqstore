# File: .github/workflows/tests.yml
#
# Runs AcqStore tests on push and pull request. Ruff is intentionally not
# enforced here yet because the current tree may have known lint findings.
# Run locally with:
#   uv run ruff check .

name: Tests
run-name: Tests • ${{ github.ref_name }} • ${{ github.event_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests with coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests with coverage
        run: |
          uv run --no-sync pytest \
            --cov=src/acqstore \
            --cov-report=term \
            --cov-report=xml:coverage.xml
